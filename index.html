<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <input type="text" placeholder="0" readonly>

        <div>
            <button class="operator" onclick="clearAll()">AC</button>
            <button class="operator" onclick="delOne()">Delt</button>
            <button class="operator" onclick="setOp('%')">%</button>
            <button class="operator" onclick="setOp('/')">/</button>
        </div>

        <div>
            <button class="operator" onclick="add('7')">7</button>
            <button class="operator" onclick="add('8')">8</button>
            <button class="operator" onclick="add('9')">9</button>
            <button class="operator" onclick="setOp('*')">*</button>
        </div>

        <div>
            <button class="operator" onclick="add('4')">4</button>
            <button class="operator" onclick="add('5')">5</button>
            <button class="operator" onclick="add('6')">6</button>
            <button class="operator" onclick="setOp('-')">-</button>
        </div>

        <div>
            <button class="operator" onclick="add('1')">1</button>
            <button class="operator" onclick="add('2')">2</button>
            <button class="operator" onclick="add('3')">3</button>
            <button class="operator" onclick="setOp('+')">+</button>
        </div>

        <div>
            <button class="operator" onclick="add('.')">.</button>
            <button class="operator" onclick="add('0')">0</button>
            <button class="operator" onclick="equal()">=</button>
            <button class="operator" onclick="clearOne()">C</button>
        </div>
    </div>
   


    <script src="app.js"></script>
</body>
</html>
